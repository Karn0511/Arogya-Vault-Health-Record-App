services:
  - type: static
    name: arogya-vault-frontend
    env: static
    plan: free
    buildCommand: npm ci && npm run build --configuration production
    publishDir: dist/arogya-vault/browser
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: arogya-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://arogya-vault-health-record-app.onrender.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: S3_BUCKET
        value: arogya-vault
      - key: GEMINI_API_KEY
        sync: false
      - key: OTP_EMAIL
        sync: false
      - key: OTP_EMAIL_PASSWORD
        sync: false
      - key: OTP_PHONE_API_KEY
        sync: false
    healthCheckPath: /health
