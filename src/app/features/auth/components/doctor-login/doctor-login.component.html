<div class="min-h-screen w-full flex bg-white overflow-hidden">

    <!-- Left Side: Branding & Illustration -->
    <div
        class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-emerald-600 to-emerald-800 relative items-center justify-center p-12 overflow-hidden">
        <!-- Background Patterns -->
        <div class="absolute inset-0 opacity-10">
            <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M0 100 C 20 0 50 0 100 100 Z" fill="white" />
            </svg>
        </div>

        <div class="relative z-10 text-center text-white max-w-lg">
            <div class="mb-8 flex justify-center">
                <div
                    class="w-24 h-24 bg-white/10 backdrop-blur-md rounded-3xl flex items-center justify-center border border-white/20 shadow-2xl">
                    <svg class="w-12 h-12 text-white" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H6v-2h4V7h2v4h4v2h-4v4z" />
                    </svg>
                </div>
            </div>

            <h1 class="text-4xl font-bold mb-6 tracking-tight">{{ currentSlide.title }}</h1>
            <p class="text-lg text-emerald-100 leading-relaxed mb-8">{{ currentSlide.description }}</p>

            <!-- Carousel Indicators -->
            <div class="flex justify-center gap-3">
                <button *ngFor="let slide of carouselData; let i = index" (click)="setSlide(i)" type="button"
                    [attr.aria-label]="'Go to slide ' + (i + 1)"
                    [attr.title]="'Go to slide ' + (i + 1)"
                    class="h-2 rounded-full transition-all duration-300 border-none p-0"
                    [ngClass]="{'bg-white w-8': i === activeIndex, 'bg-white/40 w-2 hover:bg-white/60': i !== activeIndex}">
                </button>
            </div>
        </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center items-center p-8 bg-white relative">
        <!-- Back Button -->
        <button (click)="goBack()"
            class="absolute top-8 left-8 p-2 rounded-full hover:bg-slate-100 text-slate-500 transition-colors"
            aria-label="Go back">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </button>

        <div class="w-full max-w-md space-y-8">
            <div class="text-center">
                <h2 class="text-3xl font-bold text-slate-900 tracking-tight">Doctor Portal</h2>
                <p class="mt-2 text-slate-500">Secure access for medical professionals</p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-6 mt-8">
                <div class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                                </svg>
                            </div>
                            <input id="email" type="email" formControlName="email" placeholder="doctor@hospital.com"
                                class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200 bg-slate-50 focus:bg-white" />
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </div>
                            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••••"
                                class="block w-full pl-10 pr-10 py-3 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200 bg-slate-50 focus:bg-white" />
                            <button type="button" title="Toggle password visibility" class="absolute inset-y-0 right-3 flex items-center text-slate-500 hover:text-slate-700"
                                (click)="togglePasswordVisibility()"
                                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.964 9.964 0 012.245-3.742m3.074-2.455A9.953 9.953 0 0112 5c4.477 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.043 5.197M15 12a3 3 0 00-3-3m0 0a2.99 2.99 0 012.12.879M12 9a3 3 0 00-2.121.879m0 0L3 18m6.879-8.121L3 6" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" formControlName="rememberMe"
                            class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded" />
                        <span class="ml-2 text-sm text-slate-600">Remember me</span>
                    </label>
                    <button type="button" title="Forgot password" (click)="goToForgotPassword()"
                        class="text-sm font-medium text-emerald-600 hover:text-emerald-500">
                        Forgot password?
                    </button>
                </div>

                <ng-container *ngIf="error()">
                <div class="p-4 rounded-lg bg-red-50 border border-red-100 flex items-center gap-3">
                    <svg class="h-5 w-5 text-red-500 flex-shrink-0" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p class="text-sm text-red-600">{{ error() }}</p>
                </div>
                </ng-container>

                <button type="submit" [disabled]="isLoading || loginForm.invalid"
                    class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 shadow-emerald-500/20 hover:shadow-emerald-500/40 hover:-translate-y-0.5">
                    <ng-container *ngIf="isLoading">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    </ng-container>
                    Secure Login
                </button>

                <div class="mt-8 text-center text-sm text-slate-500">
                    <p>Need technical assistance? <a href="#"
                            class="text-emerald-600 hover:text-emerald-500 font-medium">Contact Support</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
