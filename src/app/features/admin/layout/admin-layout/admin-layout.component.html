<div class="flex h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <!-- Sidebar -->
  <div class="bg-slate-800/50 backdrop-blur-xl w-64 border-r border-slate-700/50 flex flex-col">
    <!-- Header -->
    <div class="p-6 border-b border-slate-700/50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
          <span class="text-white text-xl font-bold">⚕️</span>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">Admin Panel</h1>
          <p class="text-xs text-slate-400">System Control</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2">
      <button
        *ngFor="let item of navItems"
        (click)="navigateTo(item.route)"
        [class.bg-blue-600]="isActive(item.route)"
        [class.text-white]="isActive(item.route)"
        [class.text-slate-300]="!isActive(item.route)"
        class="w-full px-4 py-3 rounded-lg hover:bg-blue-600/80 hover:text-white transition-all duration-200 flex items-center gap-3 text-left group">
        <span class="text-2xl">{{item.icon}}</span>
        <span class="font-medium">{{item.label}}</span>
      </button>
    </nav>

    <!-- User Profile & Logout -->
    <div class="p-4 border-t border-slate-700/50">
      <div class="mb-3 p-3 bg-slate-700/30 rounded-lg">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-gradient-to-br from-green-500 to-emerald-600 rounded-full flex items-center justify-center">
            <span class="text-white text-lg font-bold">A</span>
          </div>
          <div class="flex-1">
            <p class="text-sm font-medium text-white">Administrator</p>
            <p class="text-xs text-slate-400">admin&#64;arogya.com</p>
          </div>
        </div>
      </div>
      <button
        (click)="logout()"
        class="w-full px-4 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-all duration-200 flex items-center justify-center gap-2 font-medium">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </div>
</div>
