<div class="min-h-screen bg-[#020617] font-sans text-slate-100 relative selection:bg-indigo-500/30">

  <!-- Background Pattern -->
  <div
    class="fixed inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)] opacity-20 pointer-events-none z-0">
  </div>

  <!-- Ambient Glow -->
  <div
    class="fixed top-[-10%] left-[-10%] w-[600px] h-[600px] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none z-0">
  </div>
  <div
    class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-500/10 rounded-full blur-[100px] pointer-events-none z-0">
  </div>

  <div class="relative z-10 flex min-h-screen">

    <app-sidebar [navItems]="navItems" title="Admin Panel" subtitle="System Control" [isCollapsed]="isCollapsed"
      [isOpen]="isOpen" (toggleCollapse)="toggleCollapse()" (closeSidebar)="closeSidebar()" (logout)="logout()">
    </app-sidebar>

    <!-- Main Content Wrapper -->
    <div class="transition-all duration-300 min-h-screen flex flex-col" [ngClass]="{
         'lg:pl-64': !isCollapsed, 
         'lg:pl-20': isCollapsed
       }">

      <!-- Mobile Header -->
      <header
        class="sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-slate-900/80 backdrop-blur-xl border-b border-white/10 lg:hidden">
        <div class="flex items-center gap-3">
          <button (click)="toggleMobileSidebar()" class="p-2 -ml-2 rounded-lg hover:bg-white/10 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <div class="flex flex-col">
            <span
              class="text-lg font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">Admin
              Panel</span>
          </div>
        </div>
      </header>

      <!-- Main View -->
      <main class="flex-1 p-4 lg:p-8 overflow-y-auto overflow-x-hidden">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
