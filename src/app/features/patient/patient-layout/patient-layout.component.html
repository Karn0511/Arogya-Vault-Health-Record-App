<div class="flex min-h-screen w-full text-foreground relative overflow-hidden">
  <!-- Animated Background - Light Mode -->
  <div class="fixed inset-0 -z-10 overflow-hidden dark:hidden">
    <div class="absolute inset-0 bg-background"></div>
  </div>

  <!-- Animated Background - Dark Mode -->
  <div class="hidden dark:block fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute inset-0 bg-background"></div>
  </div>

  <!-- Sidebar - Desktop (Always Visible) -->
  <app-sidebar 
    [isOpen]="false" 
    [isCollapsed]="isSidebarCollapsed" 
    (toggleCollapse)="toggleSidebarCollapse()"
    class="hidden lg:block">
  </app-sidebar>

  <!-- Sidebar - Mobile (Drawer) -->
  <app-sidebar 
    [isOpen]="isSidebarOpen"
    (closeSidebar)="isSidebarOpen = false"
    class="lg:hidden">
  </app-sidebar>

  <!-- Main Content Area -->
  <div class="flex flex-1 flex-col w-full transition-all duration-300"
    [ngClass]="isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'">
    
    <!-- Header with responsive hamburger -->
    <app-header (menuClick)="toggleSidebar()"></app-header>

    <!-- Main Content with responsive padding -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto custom-scrollbar bg-background">
      <div class="p-3 sm:p-4 md:p-6 lg:p-8 max-w-[1920px] mx-auto w-full">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Footer -->
    <app-footer class="hidden sm:block"></app-footer>
  </div>
</div>
