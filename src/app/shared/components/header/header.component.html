<header
  class="glass-effect-strong border-b border-border/50 p-4 sticky top-0 z-40 backdrop-blur-2xl"
>
  <div class="flex items-center justify-between gap-4">
    <!-- Left Section -->
    <div class="flex items-center gap-4 flex-1">
      <!-- Mobile Menu Button -->
      <button
        (click)="menuClick.emit()"
        aria-label="Open navigation menu"
        title="Open menu"
        class="lg:hidden p-2.5 hover:bg-accent rounded-xl transition-all duration-200 group"
      >
        <svg
          class="w-6 h-6 text-muted-foreground group-hover:text-foreground transition-colors"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>

      <!-- Search Bar with Enhanced Design -->
      <div
        class="hidden md:flex items-center gap-3 glass-effect px-5 py-3 rounded-2xl flex-1 max-w-md group hover:shadow-lg transition-all duration-200"
      >
        <svg
          class="w-5 h-5 text-muted-foreground group-hover:text-primary transition-colors"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          placeholder="Search records, medications..."
          class="bg-transparent border-none outline-none flex-1 text-sm placeholder:text-muted-foreground"
        />
        <kbd
          class="hidden sm:inline-flex items-center gap-1 px-2 py-1 text-xs font-semibold text-muted-foreground bg-muted/50 rounded-lg"
        >
          <span class="text-xs">⌘</span>K
        </kbd>
      </div>
    </div>

    <!-- Right Section -->
    <div class="flex items-center gap-2">
      <!-- Theme Toggle with Enhanced Animation -->
      <button
        (click)="toggleTheme()"
        class="relative p-2.5 hover:bg-accent rounded-xl transition-all duration-300 group overflow-hidden"
        aria-label="Toggle theme"
      >
        <div
          class="absolute inset-0 bg-gradient-to-r from-primary/0 via-primary/10 to-primary/0 opacity-0 group-hover:opacity-100 transition-opacity"
        ></div>
        <!-- Sun icon for dark mode -->
        <svg
          *ngIf="themeService.getEffectiveTheme() === 'dark'"
          class="w-5 h-5 text-yellow-400 relative z-10 transform group-hover:rotate-180 transition-transform duration-500"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            fill-rule="evenodd"
            d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
            clip-rule="evenodd"
          />
        </svg>
        <!-- Moon icon for light mode -->
        <svg
          *ngIf="themeService.getEffectiveTheme() === 'light'"
          class="w-5 h-5 text-indigo-600 relative z-10 transform group-hover:-rotate-12 transition-transform duration-500"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
        </svg>
      </button>

      <!-- Notifications -->
      <app-notifications></app-notifications>

      <!-- User Menu with Enhanced Design -->
      <div class="relative">
        <button
          (click)="toggleUserMenu()"
          class="flex items-center gap-2 p-1.5 hover:bg-accent rounded-xl transition-all duration-200 group"
        >
          <div class="relative">
            <div
              class="w-9 h-9 bg-gradient-to-br from-primary to-purple-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg group-hover:shadow-xl transition-all duration-200"
            >
              {{ currentUser?.fullName?.[0] || 'U' }}
            </div>
            <span
              class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-background rounded-full"
            ></span>
          </div>
          <svg
            class="w-4 h-4 hidden sm:block text-muted-foreground group-hover:text-foreground transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>

        <!-- User Dropdown with 3D Effect -->
        <div
          *ngIf="showUserMenu"
          class="absolute right-0 mt-3 w-64 glass-effect-strong rounded-2xl shadow-2xl overflow-hidden animate-scale-in border border-border/50"
        >
          <div
            class="p-5 bg-gradient-to-br from-primary/5 to-purple-600/5 border-b border-border/50"
          >
            <div class="flex items-center gap-3">
              <div
                class="w-12 h-12 bg-gradient-to-br from-primary to-purple-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg"
              >
                {{ currentUser?.fullName?.[0] || 'U' }}
              </div>
              <div class="flex-1 min-w-0">
                <p class="font-bold text-sm truncate">{{ currentUser?.fullName }}</p>
                <p class="text-xs text-muted-foreground truncate">{{ currentUser?.email }}</p>
              </div>
            </div>
          </div>
          <div class="p-2">
            <a
              routerLink="/patient/health-profile"
              class="flex items-center gap-3 px-4 py-3 text-sm rounded-xl hover:bg-accent transition-all duration-200 group"
            >
              <svg
                class="w-4 h-4 text-muted-foreground group-hover:text-primary transition-colors"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>
              Profile Settings
            </a>
            <a
              routerLink="/patient/settings"
              class="flex items-center gap-3 px-4 py-3 text-sm rounded-xl hover:bg-accent transition-all duration-200 group"
            >
              <svg
                class="w-4 h-4 text-muted-foreground group-hover:text-primary transition-colors"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
              Settings
            </a>
            <div class="my-2 divider"></div>
            <button
              (click)="onLogout()"
              class="w-full flex items-center gap-3 px-4 py-3 text-sm text-destructive hover:bg-destructive/10 rounded-xl transition-all duration-200 group"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                />
              </svg>
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
