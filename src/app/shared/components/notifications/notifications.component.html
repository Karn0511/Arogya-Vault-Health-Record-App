<div class="notifications-container relative">
  <!-- Notification Bell Icon with Modern Design -->
  <button 
    type="button"
    (click)="toggleDropdown()"
    class="relative p-2.5 hover:bg-accent/80 rounded-xl transition-all duration-300 group overflow-hidden focus:outline-none focus:ring-2 focus:ring-primary/50"
    [attr.aria-label]="'Notifications (' + unreadCount + ' unread)'">
    <span class="absolute inset-0 bg-gradient-to-r from-primary/0 via-primary/10 to-primary/0 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" 
      class="w-6 h-6 relative z-10 text-muted-foreground group-hover:text-foreground transition-all duration-300 group-hover:scale-110"
      [class.animate-bounce]="unreadCount > 0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
    </svg>
    <!-- Enhanced Unread Badge -->
    <span 
      *ngIf="unreadCount > 0"
      class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-gradient-to-br from-red-500 to-red-600 rounded-full min-w-[20px] shadow-lg shadow-red-500/30 animate-pulse">
      {{ unreadCount > 9 ? '9+' : unreadCount }}
    </span>
  </button>

  <!-- Modern Dropdown Panel with Premium Design -->
  <div 
    *ngIf="isOpen"
    class="absolute right-0 mt-3 w-96 card-premium rounded-2xl shadow-2xl border border-border/30 z-50 max-h-[600px] flex flex-col animate-scale-in overflow-hidden">
    
    <!-- Header with Gradient -->
    <div class="px-5 py-4 bg-gradient-to-br from-primary/5 to-primary/10 dark:from-primary/10 dark:to-primary/20 border-b border-border/30 backdrop-blur-sm flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🔔</span>
        <h3 class="text-lg font-bold">Notifications</h3>
      </div>
      <button 
        *ngIf="unreadCount > 0"
        type="button"
        (click)="markAllAsRead()"
        class="text-sm text-primary hover:text-primary/80 font-semibold transition-colors duration-200 hover:scale-105">
        Mark all read
      </button>
    </div>

    <!-- Notifications List with Smooth Animations -->
    <div class="overflow-y-auto flex-1 divide-y divide-border/20">
      <div 
        *ngFor="let notification of notifications; let i = index"
        [class]="'px-5 py-4 hover:bg-accent/50 transition-all duration-300 cursor-pointer group relative overflow-hidden ' + (!notification.read ? 'bg-primary/5 dark:bg-primary/10 border-l-4 border-primary' : '')"
        [style.animation-delay]="i * 50 + 'ms'"
        class="stagger-animation"
        (click)="markAsRead(notification.id)">
        
        <!-- Hover Gradient Effect -->
        <div class="absolute inset-0 bg-gradient-to-r from-primary/0 via-primary/5 to-primary/0 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        
        <div class="flex items-start space-x-3 relative z-10">
          <!-- Icon with 3D Effect -->
          <div [class]="'flex-shrink-0 w-11 h-11 rounded-xl flex items-center justify-center text-xl shadow-md group-hover:scale-110 group-hover:rotate-3 transition-all duration-300 ' + (!notification.read ? 'bg-gradient-to-br from-primary/20 to-primary/30 ring-2 ring-primary/30' : 'bg-gradient-to-br from-muted/50 to-muted')">
            {{ getNotificationIcon(notification.type) }}
          </div>
          
          <!-- Content -->
          <div class="flex-1 min-w-0">
            <p [class]="'text-sm font-semibold leading-tight ' + (!notification.read ? 'text-foreground' : 'text-muted-foreground')">
              {{ notification.title }}
            </p>
            <p class="text-xs text-muted-foreground mt-1 line-clamp-2">
              {{ notification.description }}
            </p>
            <p class="text-xs text-muted-foreground/70 mt-2 flex items-center gap-1">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              </svg>
              {{ getTimeAgo(notification.date) }}
            </p>
          </div>
          
          <!-- Unread Indicator -->
          <div *ngIf="!notification.read" class="flex-shrink-0 pt-1">
            <span class="inline-block w-2.5 h-2.5 bg-primary rounded-full animate-pulse shadow-lg shadow-primary/50"></span>
          </div>
        </div>
      </div>

      <!-- Modern Empty State -->
      <div *ngIf="notifications.length === 0" class="px-5 py-16 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-muted to-muted/50 rounded-2xl mb-4 shadow-inner">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-muted-foreground">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
          </svg>
        </div>
        <p class="text-foreground font-semibold mb-1">No notifications</p>
        <p class="text-sm text-muted-foreground">You're all caught up! 🎉</p>
      </div>
    </div>

    <!-- Modern Footer -->
    <div *ngIf="notifications.length > 0" class="px-5 py-3 bg-gradient-to-br from-muted/30 to-muted/50 dark:from-muted/20 dark:to-muted/30 border-t border-border/30 text-center backdrop-blur-sm">
      <a href="#" class="text-sm text-primary hover:text-primary/80 font-semibold inline-flex items-center gap-2 transition-all duration-200 hover:scale-105">
        View all notifications
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </a>
    </div>
  </div>
</div>
