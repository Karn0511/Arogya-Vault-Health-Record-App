<div class="notifications-container relative">
  <!-- Notification Bell Icon -->
  <button 
    type="button"
    (click)="toggleDropdown()"
    class="relative p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-primary"
    [attr.aria-label]="'Notifications (' + unreadCount + ' unread)'">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
    </svg>
    <!-- Unread Badge -->
    <span 
      *ngIf="unreadCount > 0"
      class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-500 rounded-full min-w-[20px]">
      {{ unreadCount > 9 ? '9+' : unreadCount }}
    </span>
  </button>

  <!-- Dropdown Panel -->
  <div 
    *ngIf="isOpen"
    class="absolute right-0 mt-2 w-96 bg-white dark:bg-gray-800 rounded-lg shadow-2xl border border-gray-200 dark:border-gray-700 z-50 max-h-[600px] flex flex-col animate-fade-in">
    
    <!-- Header -->
    <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
      <h3 class="text-lg font-semibold">Notifications</h3>
      <button 
        *ngIf="unreadCount > 0"
        type="button"
        (click)="markAllAsRead()"
        class="text-sm text-primary hover:text-primary/80 font-medium">
        Mark all read
      </button>
    </div>

    <!-- Notifications List -->
    <div class="overflow-y-auto flex-1 divide-y divide-gray-100 dark:divide-gray-700">
      <div 
        *ngFor="let notification of notifications"
        [class]="'px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors cursor-pointer ' + (!notification.read ? 'bg-blue-50 dark:bg-blue-900/10' : '')"
        (click)="markAsRead(notification.id)">
        
        <div class="flex items-start space-x-3">
          <!-- Icon -->
          <div [class]="'flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-xl ' + (!notification.read ? 'bg-primary/10' : 'bg-gray-100 dark:bg-gray-700')">
            {{ getNotificationIcon(notification.type) }}
          </div>
          
          <!-- Content -->
          <div class="flex-1 min-w-0">
            <p [class]="'text-sm font-medium ' + (!notification.read ? 'text-gray-900 dark:text-white' : 'text-gray-600 dark:text-gray-400')">
              {{ notification.title }}
            </p>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">
              {{ notification.description }}
            </p>
            <p class="text-xs text-gray-400 dark:text-gray-500 mt-1 flex items-center">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3 mr-1">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              </svg>
              {{ getTimeAgo(notification.date) }}
            </p>
          </div>
          
          <!-- Unread Indicator -->
          <div *ngIf="!notification.read" class="flex-shrink-0">
            <span class="inline-block w-2 h-2 bg-primary rounded-full"></span>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="notifications.length === 0" class="px-4 py-12 text-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mx-auto text-gray-400 mb-3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0M3.172 5.172a4 4 0 0 1 5.656 0L10 6.343l1.172-1.171a4 4 0 1 1 5.656 5.656L10 17.657l-6.828-6.829a4 4 0 0 1 0-5.656Z" />
        </svg>
        <p class="text-gray-500 dark:text-gray-400">No notifications</p>
        <p class="text-sm text-gray-400 dark:text-gray-500">You're all caught up!</p>
      </div>
    </div>

    <!-- Footer -->
    <div *ngIf="notifications.length > 0" class="px-4 py-3 border-t border-gray-200 dark:border-gray-700 text-center">
      <a href="#" class="text-sm text-primary hover:text-primary/80 font-medium">
        View all notifications
      </a>
    </div>
  </div>
</div>
