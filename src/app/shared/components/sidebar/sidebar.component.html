<!-- Mobile Overlay -->
<div *ngIf="isOpen" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 lg:hidden animate-fade-in" (click)="closeSidebar.emit()">
</div>

<!-- Sidebar -->
<aside [ngClass]="{
    'translate-x-0': isOpen,
    '-translate-x-full lg:translate-x-0': !isOpen,
    'w-64': !isCollapsed,
    'w-20': isCollapsed
  }"
  class="fixed top-0 left-0 h-screen glass-effect-strong border-r border-border transition-all duration-300 z-50 flex flex-col">

  <!-- Logo -->
  <div class="p-4 border-b border-border flex items-center justify-between">
    <div class="flex items-center gap-3" [class.justify-center]="isCollapsed">
      <!-- Enhanced Logo with Medical Symbol -->
      <div class="relative w-10 h-10 bg-gradient-to-br from-primary via-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg overflow-hidden group">
        <!-- Animated Background Glow -->
        <div class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        
        <!-- Medical Cross Icon -->
        <svg class="w-6 h-6 text-white relative z-10 transition-transform duration-300 group-hover:scale-110" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H6v-2h4V7h2v4h4v2h-4v4z"/>
        </svg>
        
        <!-- Pulse Animation Ring -->
        <div class="absolute inset-0 rounded-xl border-2 border-white/30 animate-ping opacity-75"></div>
      </div>
      
      <div *ngIf="!isCollapsed" class="flex flex-col">
        <span class="text-xl font-bold bg-gradient-to-r from-primary to-purple-600 bg-clip-text text-transparent leading-none">
          ArogyaVault
        </span>
        <span class="text-[10px] text-muted-foreground font-medium tracking-wider uppercase">Health Records</span>
      </div>
    </div>
    <button (click)="toggleCollapse.emit()" class="hidden lg:block p-2 hover:bg-accent rounded-lg transition-colors group"
      *ngIf="!isCollapsed">
      <svg class="w-5 h-5 text-muted-foreground group-hover:text-foreground transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
    </button>
    <button (click)="toggleCollapse.emit()" class="hidden lg:block p-2 hover:bg-accent rounded-lg transition-colors group"
      *ngIf="isCollapsed">
      <svg class="w-5 h-5 text-muted-foreground group-hover:text-foreground transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-3 space-y-1 overflow-y-auto custom-scrollbar">
    <button *ngFor="let item of navItems" (click)="navigate(item.route)" [ngClass]="{
        'bg-gradient-to-r from-primary to-purple-600 text-white shadow-lg': isActiveRoute(item.route),
        'hover:bg-accent text-foreground': !isActiveRoute(item.route),
        'justify-center px-2': isCollapsed,
        'justify-start px-3': !isCollapsed
      }" class="w-full flex items-center gap-3 py-3 rounded-xl transition-all duration-200 group relative">
      <svg class="w-5 h-5 flex-shrink-0" [class.text-white]="isActiveRoute(item.route)" [class.text-muted-foreground]="!isActiveRoute(item.route)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path *ngIf="item.icon === 'home'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        <path *ngIf="item.icon === 'folder'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        <path *ngIf="item.icon === 'user'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        <path *ngIf="item.icon === 'pill'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        <path *ngIf="item.icon === 'calendar'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        <path *ngIf="item.icon === 'chart'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        <path *ngIf="item.icon === 'image'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        <path *ngIf="item.icon === 'symptom'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        <path *ngIf="item.icon === 'bell'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        <path *ngIf="item.icon === 'layout'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
      </svg>
      <span *ngIf="!isCollapsed" class="text-sm font-medium" [class.text-white]="isActiveRoute(item.route)">{{ item.label }}</span>
      <span *ngIf="item.badge && !isCollapsed"
        class="ml-auto px-2 py-0.5 rounded-full text-xs font-bold"
        [class.bg-white]="isActiveRoute(item.route)"
        [class.text-primary]="isActiveRoute(item.route)"
        [class.bg-primary]="!isActiveRoute(item.route)"
        [class.text-white]="!isActiveRoute(item.route)">
        {{ item.badge }}
      </span>

      <!-- Tooltip for collapsed state -->
      <div *ngIf="isCollapsed"
        class="absolute left-full ml-3 px-3 py-2 bg-popover text-popover-foreground text-sm rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all whitespace-nowrap border border-border z-50">
        {{ item.label }}
        <div class="absolute -left-1 top-1/2 -translate-y-1/2 w-2 h-2 bg-popover border-l border-b border-border rotate-45"></div>
      </div>
    </button>
  </nav>

  <!-- User Profile -->
  <div class="p-4 border-t border-border">
    <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-accent transition-colors cursor-pointer" [class.justify-center]="isCollapsed">
      <div
        class="w-11 h-11 bg-gradient-to-br from-primary to-purple-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg flex-shrink-0">
        {{ currentUser?.fullName?.[0] || 'U' }}
      </div>
      <div *ngIf="!isCollapsed" class="flex-1 min-w-0">
        <p class="text-sm font-semibold truncate">{{ currentUser?.fullName }}</p>
        <p class="text-xs text-muted-foreground truncate">{{ currentUser?.email }}</p>
      </div>
    </div>
  </div>
</aside>
