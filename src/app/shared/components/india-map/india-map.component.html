<div class="map-container relative w-full h-full flex items-center justify-center">
    <svg viewBox="0 0 400 500" class="w-full h-full max-w-[500px] drop-shadow-2xl">
        <defs>
            <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.6" />
                <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.6" />
            </linearGradient>
            <filter id="glow">
                <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
                <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>

        <!-- Simplified India Map Outline -->
        <!-- This is a stylized representation -->
        <path
            d="M130,20 L180,20 L200,50 L250,60 L280,50 L320,80 L300,120 L350,130 L380,150 L350,200 L320,220 L300,280 L250,350 L200,450 L150,480 L100,450 L80,350 L50,300 L20,250 L50,200 L80,150 L100,100 L130,50 Z"
            class="map-outline transition-all duration-500" fill="url(#mapGradient)" stroke="rgba(255,255,255,0.5)"
            stroke-width="1" />

        <!-- Interactive Regions -->
        <g *ngFor="let region of regions" class="region-group cursor-pointer transition-all duration-300"
            (mouseenter)="onRegionHover(region.name)" (mouseleave)="onRegionLeave()">

            <circle [attr.cx]="region.cx" [attr.cy]="region.cy" [attr.r]="region.r"
                class="region-marker fill-white/10 stroke-white/30 hover:fill-primary/40 hover:stroke-primary transition-all duration-300"
                stroke-width="1" />

            <circle [attr.cx]="region.cx" [attr.cy]="region.cy" r="4" class="fill-white animate-pulse" />

            <!-- Connecting Lines (Decorative) -->
            <line x1="200" y1="250" [attr.x2]="region.cx" [attr.y2]="region.cy" stroke="rgba(255,255,255,0.1)"
                stroke-width="1" />
        </g>

    </svg>

    <!-- Floating Info Card -->
    <div *ngIf="hoveredRegion"
        class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 glass-effect-strong p-4 rounded-xl border border-white/20 animate-fade-in text-center pointer-events-none">
        <h3 class="text-lg font-bold text-white">{{ hoveredRegion }}</h3>
        <p class="text-xs text-white/70">Active Health Centers: {{ (hoveredRegion.length * 12) + 45 }}</p>
        <div class="mt-2 flex gap-2 justify-center">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            <span class="text-[10px] text-green-400 uppercase tracking-wider">Operational</span>
        </div>
    </div>
</div>
