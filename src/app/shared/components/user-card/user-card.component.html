<!-- 3D Glass Effect User Card -->
<div class="group relative perspective-1000" *ngIf="user">
  <!-- Glow Effect -->
  <div
    class="absolute -inset-0.5 bg-gradient-to-r from-teal-400 via-cyan-500 to-blue-500 rounded-3xl blur-xl opacity-40 group-hover:opacity-75 transition-all duration-500 animate-pulse-slow"
  ></div>

  <!-- Main Card -->
  <div
    class="relative glass-effect-strong rounded-3xl p-8 shadow-2xl border border-white/40 hover:scale-[1.02] transition-all duration-500 overflow-hidden backdrop-blur-3xl"
  >
    <!-- Animated Background Gradient -->
    <div class="absolute inset-0 opacity-20 bg-gradient-mesh pointer-events-none"></div>

    <!-- Floating Particles Effect -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div
        class="absolute top-10 left-10 w-32 h-32 bg-teal-400/10 rounded-full blur-2xl animate-bounce-subtle"
      ></div>
      <div
        class="absolute bottom-10 right-10 w-40 h-40 bg-blue-400/10 rounded-full blur-2xl animate-pulse-slow"
      ></div>
    </div>

    <div class="relative z-10 flex items-start gap-6">
      <!-- User Avatar with 3D Effect -->
      <div class="relative group/avatar">
        <!-- Avatar Glow -->
        <div
          class="absolute -inset-1 bg-gradient-to-br from-teal-400 to-blue-500 rounded-2xl blur-lg opacity-60 group-hover/avatar:opacity-100 transition-opacity"
        ></div>

        <!-- Avatar Container -->
        <div class="relative">
          <div
            class="w-24 h-24 bg-gradient-to-br from-teal-500 via-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-xl group-hover/avatar:scale-110 group-hover/avatar:rotate-6 transition-all duration-500 border-4 border-white/30"
          >
            <img
              *ngIf="user.photoURL"
              [src]="user.photoURL"
              [alt]="user.fullName || 'User avatar'"
              title="User avatar"
              class="w-full h-full rounded-xl object-cover"
            />
            <span *ngIf="!user.photoURL" class="text-4xl font-black text-white tracking-tight">
              {{ getInitials(user) }}
            </span>
          </div>

          <!-- Online Status Indicator -->
          <span class="absolute bottom-0 right-0 flex h-6 w-6">
            <span
              class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"
            ></span>
            <span
              class="relative inline-flex rounded-full h-6 w-6 bg-green-500 border-4 border-white shadow-lg"
            ></span>
          </span>
        </div>
      </div>

      <!-- User Info -->
      <div class="flex-1 space-y-4">
        <!-- Name and Role -->
        <div>
          <div class="flex items-center gap-2 mb-1">
            <h3
              class="text-2xl font-black bg-gradient-to-r from-slate-800 to-slate-600 dark:from-white dark:to-slate-300 bg-clip-text text-transparent"
            >
              {{ user.fullName }}
            </h3>
            <span
              class="px-2.5 py-1 bg-gradient-to-r from-teal-500/20 to-cyan-500/20 border border-teal-500/30 text-teal-700 dark:text-teal-300 text-xs font-bold rounded-lg"
            >
              ✓ Verified
            </span>
          </div>
          <p class="text-sm text-slate-600 dark:text-slate-400 font-medium flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              />
            </svg>
            {{ user.email }}
          </p>
        </div>

        <!-- Health Stats Grid -->
        <div class="grid grid-cols-3 gap-4">
          <!-- Health ID -->
          <div
            class="glass-effect p-3 rounded-xl border border-white/30 hover:shadow-lg transition-all"
          >
            <p
              class="text-xs text-slate-500 dark:text-slate-400 font-semibold mb-1 uppercase tracking-wider"
            >
              Health ID
            </p>
            <p class="font-mono text-sm font-bold text-slate-800 dark:text-white truncate">
              {{ healthId || 'INB-' + (user.id.substring(0, 12) || '') }}
            </p>
          </div>

          <!-- Health Score -->
          <div
            class="glass-effect p-3 rounded-xl border border-green-500/30 bg-gradient-to-br from-green-50/50 to-emerald-50/50 dark:from-green-900/20 dark:to-emerald-900/20 hover:shadow-lg transition-all"
          >
            <p
              class="text-xs text-green-700 dark:text-green-400 font-semibold mb-1 uppercase tracking-wider"
            >
              Health Score
            </p>
            <div class="flex items-baseline gap-1">
              <p class="text-2xl font-black text-green-600 dark:text-green-400">
                {{ healthScore || 92 }}
              </p>
              <span class="text-xs text-green-600/60 dark:text-green-400/60 font-bold">/100</span>
            </div>
          </div>

          <!-- Last Checkup -->
          <div
            class="glass-effect p-3 rounded-xl border border-white/30 hover:shadow-lg transition-all"
          >
            <p
              class="text-xs text-slate-500 dark:text-slate-400 font-semibold mb-1 uppercase tracking-wider"
            >
              Last Checkup
            </p>
            <p class="text-sm font-bold text-slate-800 dark:text-white">
              {{ lastCheckup || 'Oct 15, 2025' }}
            </p>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="flex gap-2 pt-2">
          <button
            class="flex-1 px-4 py-2.5 bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-600 hover:to-cyan-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-teal-500/30 hover:shadow-xl hover:shadow-teal-500/50 transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            View Profile
          </button>
          <button
            class="px-4 py-2.5 glass-effect border border-white/40 hover:bg-white/60 dark:hover:bg-slate-800/60 text-slate-700 dark:text-slate-200 rounded-xl font-bold text-sm shadow-sm hover:shadow-md transition-all duration-300 hover:scale-105 flex items-center justify-center gap-2"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            Settings
          </button>
        </div>
      </div>
    </div>

    <!-- Decorative Elements -->
    <div class="absolute top-4 right-4 opacity-10 dark:opacity-5">
      <svg class="w-32 h-32 text-teal-500" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
        />
      </svg>
    </div>
  </div>
</div>
