<div class="fixed bottom-6 right-6 z-50">
  <!-- Toggle Button -->
  <button
    (click)="toggleAssistant()"
    class="h-16 w-16 rounded-full bg-gradient-to-br from-purple-500 to-blue-500 text-white shadow-xl flex items-center justify-center hover:scale-110 transition-transform duration-300 group">
    <svg *ngIf="!isOpen" class="w-8 h-8 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
    </svg>
    <svg *ngIf="isOpen" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>

  <!-- Chat Window -->
  <div
    *ngIf="isOpen"
    class="absolute bottom-20 right-0 w-96 max-w-[calc(100vw-2rem)] h-[600px] max-h-[70vh] glass-effect rounded-2xl shadow-2xl flex flex-col animate-modal-in border border-border">
    
    <!-- Header -->
    <div class="p-4 border-b border-border flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div>
          <h3 class="font-bold">ArogyaVault AI</h3>
          <p class="text-xs text-muted-foreground">Your Health Assistant</p>
        </div>
      </div>
      
      <!-- Mode Selector -->
      <div class="relative">
        <button
          (click)="showModeSelector = !showModeSelector"
          class="px-3 py-1 text-xs bg-muted rounded-full hover:bg-accent transition-colors flex items-center gap-1">
          <span class="capitalize">{{ aiMode }}</span>
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        
        <div
          *ngIf="showModeSelector"
          class="absolute top-full mt-2 right-0 w-32 bg-card border border-border rounded-lg shadow-lg z-10 overflow-hidden">
          <button
            (click)="setMode('fast')"
            class="w-full text-left px-3 py-2 text-sm hover:bg-accent transition-colors">
            Fast
          </button>
          <button
            (click)="setMode('normal')"
            class="w-full text-left px-3 py-2 text-sm hover:bg-accent transition-colors">
            Normal
          </button>
          <button
            (click)="setMode('pro')"
            class="w-full text-left px-3 py-2 text-sm hover:bg-accent transition-colors">
            Thinking
          </button>
        </div>
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
      <div
        *ngFor="let message of messages; trackBy: trackByMessageId"
        [ngClass]="message.role === 'user' ? 'flex-row-reverse' : ''"
        class="flex items-start gap-3">
        
        <div class="w-8 h-8 rounded-full bg-muted flex items-center justify-center flex-shrink-0">
          <span class="text-sm font-semibold">{{ message.role === 'user' ? userName[0] : 'AI' }}</span>
        </div>
        
        <div
          [ngClass]="message.role === 'user' ? 'bg-primary text-primary-foreground' : 'bg-muted'"
          class="max-w-[75%] rounded-2xl p-3 shadow-sm">
          
          <img *ngIf="message.image" [src]="message.image" class="rounded-lg mb-2 max-w-full" alt="Uploaded" />
          
          <p class="text-sm whitespace-pre-wrap">
            {{ message.text }}
            <span *ngIf="message.isLoading" class="inline-block w-1 h-4 bg-current animate-pulse ml-1"></span>
          </p>
          
          <div *ngIf="message.sources && message.sources.length > 0" class="mt-2 pt-2 border-t border-current/20">
            <p class="text-xs font-semibold mb-1">Sources:</p>
            <div class="space-y-1">
              <a
                *ngFor="let source of message.sources; let i = index"
                [href]="source.uri"
                target="_blank"
                rel="noopener noreferrer"
                class="text-xs underline hover:opacity-80 block truncate">
                {{ i + 1 }}. {{ source.title || source.uri }}
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 border-t border-border flex-shrink-0">
      <!-- Image Preview -->
      <div *ngIf="selectedImage" class="relative w-20 mb-2">
        <img [src]="selectedImage" class="rounded-lg" alt="Preview" />
        <button
          (click)="removeImage()"
          class="absolute -top-2 -right-2 w-6 h-6 bg-destructive text-destructive-foreground rounded-full flex items-center justify-center">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      
      <!-- Input Row -->
      <div class="flex items-center gap-2">
        <input
          type="file"
          #fileInput
          (change)="onImageSelect($event)"
          accept="image/png,image/jpeg"
          class="hidden" />
        
        <button
          (click)="fileInput.click()"
          class="p-2 hover:bg-accent rounded-lg transition-colors"
          [disabled]="isLoading">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </button>
        
        <input
          type="text"
          [(ngModel)]="input"
          (keydown.enter)="!isLoading && sendMessage()"
          [disabled]="isLoading"
          placeholder="Ask a question..."
          class="flex-1 px-4 py-2 bg-muted border border-border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm" />
        
        <button
          (click)="sendMessage()"
          [disabled]="isLoading || (!input.trim() && !selectedImage)"
          class="p-2 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <svg *ngIf="!isLoading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
          <svg *ngIf="isLoading" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
