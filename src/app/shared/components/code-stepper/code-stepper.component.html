<div class="max-w-4xl mx-auto p-4 sm:p-6 font-sans">
    <div class="relative">
        <div *ngFor="let step of steps; let i = index; let isLast = last"
            class="flex gap-4 sm:gap-6 pb-12 relative group animate-fade-in" [style.animation-delay]="i * 100 + 'ms'">

            <!-- Connecting Line -->
            <div *ngIf="!isLast"
                class="absolute left-[19px] top-10 bottom-0 w-px bg-white/10 group-hover:bg-white/20 transition-colors duration-300">
            </div>

            <!-- Step Number -->
            <div class="flex-shrink-0 relative z-10">
                <div
                    class="w-10 h-10 rounded-full bg-[#111] border border-white/10 flex items-center justify-center text-sm font-medium text-slate-500 group-hover:text-white group-hover:border-primary/50 group-hover:bg-primary/10 transition-all duration-300 shadow-xl shadow-black/50">
                    {{ i + 1 }}
                </div>
            </div>

            <!-- Content -->
            <div class="flex-1 space-y-3 pt-1 min-w-0">
                <h3
                    class="text-lg font-medium text-white tracking-tight group-hover:text-primary transition-colors duration-300">
                    {{ step.title }}</h3>
                <p class="text-slate-400 text-sm leading-relaxed">{{ step.description }}</p>

                <!-- Code Block -->
                <div *ngIf="step.code"
                    class="mt-4 relative group/code rounded-xl overflow-hidden border border-white/10 shadow-2xl bg-[#050505]">

                    <!-- Header -->
                    <div
                        class="h-10 bg-white/[0.03] border-b border-white/5 flex items-center px-4 justify-between select-none">
                        <div class="flex gap-1.5 opacity-50">
                            <div class="w-2.5 h-2.5 rounded-full bg-red-500/80"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-yellow-500/80"></div>
                            <div class="w-2.5 h-2.5 rounded-full bg-green-500/80"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <svg class="w-3 h-3 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 9l3 3-3 3m5 0h3" />
                            </svg>
                            <span class="text-xs font-mono text-slate-600">{{ step.language || 'Terminal' }}</span>
                        </div>
                    </div>

                    <!-- Code Content -->
                    <div class="relative">
                        <pre
                            class="p-4 sm:p-5 overflow-x-auto text-sm font-mono text-slate-300 scrollbar-thin scrollbar-thumb-white/10 hover:scrollbar-thumb-white/20">
<code class="block outline-none whitespace-pre">{{ step.code }}</code>
</pre>

                        <!-- Copy Button -->
                        <button (click)="copyToClipboard(step.code, i)"
                            class="absolute top-3 right-3 p-1.5 rounded-md bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white opacity-0 group-hover/code:opacity-100 transition-all duration-200 border border-white/5">
                            <span class="sr-only">Copy</span>
                            <svg *ngIf="copiedIndex !== i" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            <svg *ngIf="copiedIndex === i" class="w-4 h-4 text-emerald-500"
                                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
