<div class="card h-full">
  <div class="card-header">
    <div class="flex items-start justify-between">
      <div>
        <h3 class="card-title flex items-center text-base font-bold">
          <span class="h-2.5 w-2.5 rounded-full bg-primary mr-2"></span>
          Analytics
        </h3>
        <p class="card-description">Resting Heart Rate (Last 7 Days)</p>
      </div>
      <div class="text-right">
        <p class="text-3xl font-extrabold tracking-tight">{{ lastValue }}</p>
        <p class="text-xs text-muted-foreground -mt-1">BPM</p>
      </div>
    </div>
  </div>
  <div class="card-content">
    <div echarts [options]="chartOption" class="chart-container"></div>
  </div>
</div>
