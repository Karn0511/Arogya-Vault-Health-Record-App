services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: arogya-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: arogya
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./arogya-vault/database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - arogya-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend API
  backend:
    build:
      context: ./arogya-vault/backend
      dockerfile: Dockerfile
    container_name: arogya-backend
    restart: unless-stopped
    env_file:
      - ./arogya-vault/backend/.env.docker
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./arogya-vault/backend/uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - arogya-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/admin/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend (Angular App)
  frontend:
    build:
      context: ./arogya-vault
      dockerfile: Dockerfile
    container_name: arogya-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - arogya-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Express (Database UI)
  mongo-express:
    image: mongo-express:latest
    container_name: arogya-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - arogya-network

networks:
  arogya-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  backend_logs:
    driver: local
